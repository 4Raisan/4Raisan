name: Refresh profile activity
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/profile-assets.yml'
      - 'scripts/**'
      - 'tests/**'
      - 'profile.json'
permissions:
  contents: write
concurrency:
  group: profile-activity-${{ github.ref }}
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Test activity refresh
        run: python3 -m unittest discover -s tests -v
      - name: Generate profile artwork
        run: python3 scripts/build_design.py
      # The upstream stats action queries stargazers on other repositories,
      # which GitHub denies to this repository's built-in token. Fetch only
      # public contribution fields; keep the same scheduled, committed SVG model.
      - name: Generate public statistics
        run: python3 scripts/generate_stats.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Read snake profile account
        run: python3 -c "import json, os; c=json.load(open('profile.json')); open(os.environ['GITHUB_ENV'], 'a').write('SNAKE_USERNAME=' + c['username'] + '\n')"
      - name: Generate original contribution snake
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3, original generator
        with:
          github_user_name: ${{ env.SNAKE_USERNAME }}
          outputs: .generated/snake.svg?color_snake=#A7CDBB&color_dots=#141916,#174B36,#187D52,#24AA73,#34D399
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate and publish activity assets
        run: python3 scripts/publish_activity.py
      - name: Commit changed assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/stats.svg assets/calendar.svg assets/snake.svg assets/header.svg assets/header-static.svg assets/header-mobile.svg README.md
          if ! git diff --cached --quiet; then
            git commit -m "Refresh public profile activity"
            git push
          fi
