name: Refresh profile activity
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/profile-assets.yml'
      - 'scripts/publish_activity.py'
permissions:
  contents: write
concurrency:
  group: profile-activity-${{ github.ref }}
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Generate public statistics
        uses: readme-tools/github-readme-stats-action@94833c3d5a4b13dde2ba33224e3ea8624f474d11 # reviewed main, 2026-09-18
        with:
          card: stats
          options: username=4Raisan&show_icons=true&hide_rank=true&hide=stars&bg_color=090B0A&title_color=34D399&text_color=A7CDBB&icon_color=34D399&border_color=26382E&border_radius=14&disable_animations=true&custom_title=Public%20GitHub%20activity
          path: .generated/stats.svg
          core_version: '2.1.3'
          fail_on_error: 'true'
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: 4Raisan
          outputs: .generated/snake.svg?color_snake=#A7CDBB&color_dots=#141916,#174B36,#187D52,#24AA73,#34D399
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate and publish both assets
        run: python3 scripts/publish_activity.py
      - name: Commit changed assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/stats.svg assets/snake.svg README.md
          if ! git diff --cached --quiet; then
            git commit -m "Refresh public profile activity"
            git push
          fi
