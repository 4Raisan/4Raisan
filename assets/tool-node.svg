<svg xmlns="http://www.w3.org/2000/svg" width="108" height="74" viewBox="0 0 108 74" role="img" aria-label="Node.js"><title>Node.js</title><style>text{font-family:Arial,Helvetica,sans-serif} .mono{font-family:Consolas,monospace} .signal{offset-path:path('M 825 140 L 912 140 L 912 100 L 1020 100 L 1020 195 L 1118 195');animation:travel 8s linear infinite} @keyframes travel{from{offset-distance:0%}to{offset-distance:100%}} @media(prefers-reduced-motion:reduce){.signal{animation:none;display:none}}</style><g transform="translate(29 4) scale(.8)" fill="none" stroke="#34D399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M31 5l20 11v23L31 50 11 39V16zM22 35V20l17 15V20"/></g><text x="54" y="65" font-size="12" fill="#A7CDBB" text-anchor="middle">Node.js</text></svg>